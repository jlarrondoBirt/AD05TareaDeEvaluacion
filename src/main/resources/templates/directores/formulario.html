<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Films - Formulario de director</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: menu}"></div>

    <div class="container mt-4">

        <h1 th:text="${director.idDirector == null} ? 'Nuevo director' : 'Editar director'">
        </h1>

        <form th:action="@{/directores/guardar}" th:object="${director}" method="post">

            <input type="hidden" th:field="*{idDirector}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" th:field="*{apellido}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nacionalidad</label>
                <input type="text" th:field="*{nacionalidad}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Edad</label>
                <input type="number" th:field="*{edad}" class="form-control" min="1" max="120" required>
            </div>

            <button type="submit" class="btn btn-success"> Guardar </button>

            <a th:href="@{/directores}" class="btn btn-secondary"> Cancelar </a>

        </form>

    </div>

</body>
</html>
