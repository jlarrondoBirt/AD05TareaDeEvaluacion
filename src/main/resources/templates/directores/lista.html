<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Films - Directores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: menu}"></div>

    <div class="container mt-4">

        <h1>Listado de directores</h1>

        <a th:href="@{/directores/nuevo}" class="btn btn-primary mb-3"> Añadir director </a>

        <table class="table table-striped table-bordered">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Nacionalidad</th>
                    <th>Edad</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="director : ${directores}">

                    <td th:text="${director.idDirector}"></td>
                    <td th:text="${director.nombre}"></td>
                    <td th:text="${director.apellido}"></td>
                    <td th:text="${director.nacionalidad}"></td>
                    <td th:text="${director.edad}"></td>

                    <td>
                        <a th:href="@{/directores/editar/{id}(id=${director.idDirector})}" class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/directores/eliminar/{id}(id=${director.idDirector})}" method="post" style="display:inline">

                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que quieres eliminar este director y sus películas?')">
                                Eliminar
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(directores)}"> <td colspan="6" class="text-center">
                        No hay directores registrados.
                    </td>
                </tr>

            </tbody>

        </table>

        <a th:href="@{/}" class="btn btn-secondary">
            Volver al inicio
        </a>

    </div>

</body>
</html>
