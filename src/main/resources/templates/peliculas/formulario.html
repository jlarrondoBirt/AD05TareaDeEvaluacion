<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Films - Formulario de película</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: menu}"></div>

    <div class="container mt-4">

        <h1 th:text="${pelicula.idPelicula == null} ? 'Nueva película' : 'Editar película'">
        </h1>

        <form th:action="@{/peliculas/guardar}" th:object="${pelicula}" method="post">

            <input type="hidden" th:field="*{idPelicula}">

            <div class="mb-3">
                <label class="form-label">Título</label>

                <input type="text" th:field="*{titulo}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Año</label>

                <input type="number" th:field="*{anio}" class="form-control" min="1888" max="2100" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Género</label>

                <input type="text" th:field="*{genero}" class="form-control" placeholder="Ejemplo: Drama, Acción, Comedia..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Director</label>

                <select name="directorId" class="form-select" required>

                    <option value="">Selecciona un director</option>

                    <option th:each="director : ${directores}" th:value="${director.idDirector}"
                            th:text="${director.nombre + ' ' + director.apellido}"
                            th:selected="${pelicula.director != null and director.idDirector == pelicula.director.idDirector}">
                    </option>

                </select>
            </div>

            <button type="submit" class="btn btn-success"> Guardar </button>

            <a th:href="@{/peliculas}" class="btn btn-secondary"> Cancelar </a>

        </form>

    </div>

</body>
</html>
