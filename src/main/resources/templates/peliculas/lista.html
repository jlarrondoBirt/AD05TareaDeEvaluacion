<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Films - Películas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: menu}"></div>

    <div class="container mt-4">

        <h1>Listado de películas</h1>

        <a th:href="@{/peliculas/nuevo}" class="btn btn-primary mb-3"> Añadir película </a>

        <table class="table table-striped table-bordered">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Año</th>
                    <th>Género</th>
                    <th>Director</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="pelicula : ${peliculas}">

                    <td th:text="${pelicula.idPelicula}"></td>
                    <td th:text="${pelicula.titulo}"></td>
                    <td th:text="${pelicula.anio}"></td>
                    <td th:text="${pelicula.genero}"></td>
                    <td th:text="${pelicula.director.nombre + ' ' + pelicula.director.apellido}"></td>

                    <td>
                        <a th:href="@{/peliculas/editar/{id}(id=${pelicula.idPelicula})}" class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/peliculas/eliminar/{id}(id=${pelicula.idPelicula})}" method="post" style="display:inline">

                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que quieres eliminar esta película?')">
                                Eliminar
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(peliculas)}"> <td colspan="6" class="text-center"> No hay películas registradas. </td>
                </tr>

            </tbody>

        </table>

        <a th:href="@{/}" class="btn btn-secondary"> Volver al inicio </a>

    </div>

</body>
</html>
